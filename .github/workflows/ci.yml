name: FactoryProof CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stage: [stage-1, stage-2, stage-3, stage-4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test stage
        run: python -m unittest discover -s tests -v
        working-directory: ${{ matrix.stage }}
      - name: Build stage container
        run: docker build -t factoryproof-${{ matrix.stage }}:ci .
        working-directory: ${{ matrix.stage }}

      dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify dashboard
        run: python scripts/verify.py
      - name: Check local harness
        run: ./harness check
